name: Generate Apks

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Gradle Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Sign Release Apks
        run: |
          curl -L -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar ./uber-apk-signer.jar --apks ./app/build/outputs/apk/androidos/release/app-androidos-release-unsigned.apk
          java -jar ./uber-apk-signer.jar --apks ./app/build/outputs/apk/chromeos/release/app-chromeos-release-unsigned.apk
          java -jar ./uber-apk-signer.jar --apks ./app/build/outputs/apk/questos/release/app-questos-release-unsigned.apk

      - name: Upload Apks
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ./app/build/outputs/apk/**/debug/*.apk
            ./app/build/outputs/apk/**/release/*.apk