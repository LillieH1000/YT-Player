[versions]
activityComposeVersion = "1.10.1"
chaquopyVersion = "16.0.0"
composeBomVersion = "2025.04.01"
coreVersion = "1.16.0"
foundationVersion = "1.8.0"
gsonVersion = "2.13.1"
kotlinxCoroutinesVersion = "1.10.2"
ktorVersion = "3.1.2"
lifecycleVersion = "2.8.7"
material3Version = "1.3.2"
androidVersion = "8.9.2"
kotlinVersion = "2.1.20"
media3Version = "1.6.1"
runtimeVersion = "1.8.0"
uiVersion = "1.8.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityComposeVersion" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBomVersion" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreVersion" }
androidx-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "foundationVersion" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycleVersion" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleVersion" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Version" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3Version" }
androidx-media3-common-ktx = { module = "androidx.media3:media3-common-ktx", version.ref = "media3Version" }
androidx-media3-container = { module = "androidx.media3:media3-container", version.ref = "media3Version" }
androidx-media3-database = { module = "androidx.media3:media3-database", version.ref = "media3Version" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3Version" }
androidx-media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3Version" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Version" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3Version" }
androidx-media3-exoplayer-smoothstreaming = { module = "androidx.media3:media3-exoplayer-smoothstreaming", version.ref = "media3Version" }
androidx-media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3Version" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3Version" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Version" }
androidx-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "runtimeVersion" }
androidx-ui = { module = "androidx.compose.ui:ui", version.ref = "uiVersion" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "uiVersion" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiVersion" }
gson = { module = "com.google.code.gson:gson", version.ref = "gsonVersion" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesVersion" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesVersion" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorVersion" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorVersion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidVersion" }
chaquopy-python = { id = "com.chaquo.python", version.ref = "chaquopyVersion" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinVersion" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }