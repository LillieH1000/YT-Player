[versions]
activityCompose = "1.10.1"
chaquopy = "16.0.0"
composeBom = "2025.04.00"
core = "1.16.0"
gson = "2.13.1"
kotlinxCoroutines = "1.10.2"
ktor = "3.1.2"
lifecycle = "2.8.7"
android = "8.9.2"
kotlin = "2.1.20"
media3 = "1.6.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
