[versions]
appcompatVersion = "1.7.0"
chaquopyVersion = "16.0.0"
coilVersion = "3.1.0"
coreVersion = "1.15.0"
kotlinxCoroutinesVersion = "1.10.1"
ktorVersion = "3.1.1"
lifecycleVersion = "2.8.7"
materialVersion = "1.12.0"
androidVersion = "8.8.2"
kotlinVersion = "2.1.10"
media3Version = "1.5.1"
mediarouterVersion = "1.7.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreVersion" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycleVersion" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleVersion" }
androidx-media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3Version" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3Version" }
androidx-media3-common-ktx = { module = "androidx.media3:media3-common-ktx", version.ref = "media3Version" }
androidx-media3-container = { module = "androidx.media3:media3-container", version.ref = "media3Version" }
androidx-media3-database = { module = "androidx.media3:media3-database", version.ref = "media3Version" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3Version" }
androidx-media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3Version" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Version" }
