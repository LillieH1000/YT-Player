name: Gradle Build

on:
  workflow_dispatch:
  push:
    branches:
      - "v4"
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Gradle Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload Builds
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            ./app/build/outputs/apk/**/debug/*.apk
            ./app/build/outputs/apk/**/release/*.apk