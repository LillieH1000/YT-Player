name: Gradle Build

on:
  push:
    branches: [ "ytdlp" ]
  pull_request:
    branches: [ "ytdlp" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Gradle Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload Builds
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: ./app/build/outputs/apk/**/debug/*.apk