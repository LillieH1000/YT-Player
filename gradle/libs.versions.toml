androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Version" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouterVersion" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coilVersion" }
